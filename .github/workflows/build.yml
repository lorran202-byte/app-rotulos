name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          echo "ANDROID_HOME=$ANDROID_HOME"
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Testes de unidade
        run: ./gradlew testReleaseUnitTest 2>&1 | tee test.log
        continue-on-error: true

      - name: Lint
        run: ./gradlew lintRelease 2>&1 | tee lint.log
        continue-on-error: true

      - name: Publicar saída no branch "saida"
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log test.log lint.log /tmp/out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk /tmp/out/ 2>/dev/null || true
          cp app/build/reports/lint-results-release.txt /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          echo "${GITHUB_SHA}" > commit.txt
          git init -q -b saida
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -qm "saida ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" saida
